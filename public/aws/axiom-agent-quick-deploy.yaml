# Axiom Agent · CloudFormation Quick-Create template
# ----------------------------------------------------------------------
# One-click IAM role provisioning for the VisionXIXLabs platform.
#
# Drop this template into AWS Console via the personalized Quick-Create
# URL that visionxixlabs.com/operator/onboarding mints per session. The
# customer never copies JSON or fills out the Create Role wizard — they
# click "Create stack" and get a correctly-shaped role back.
#
# Outputs the RoleArn the platform needs.

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Provisions a read-only IAM role for the Axiom Agent (VisionXIXLabs)
  cloud scanner. The role trusts the platform's broker account
  (590183704419) and requires the session-specific ExternalId.

Parameters:
  ExternalId:
    Type: String
    Description: >
      Session-specific external id minted by visionxixlabs.com. Prevents
      the confused-deputy problem — even if someone learned the role
      name they could not assume it without this value.
    AllowedPattern: "^axiom-[a-zA-Z0-9]{8,32}$"
    ConstraintDescription: Must look like axiom-<8-32 alphanumerics>.

  BrokerAccountId:
    Type: String
    Description: >
      VisionXIXLabs broker account that will assume this role. The
      onboarding flow injects this via the CFN Quick-Create URL based
      on the broker user's actual STS GetCallerIdentity, so the
      default below is only a fallback for someone deploying this
      template by hand.
    Default: "595842668406"
    AllowedPattern: "^[0-9]{12}$"

  CallbackUrl:
    Type: String
    Description: >
      Webhook the platform receives a POST on when the stack reaches
      CREATE_COMPLETE. Lets the onboarding page auto-advance without
      the customer clicking the FinishUrl. Injected by the platform's
      Quick-Create URL.
    Default: "https://visionxixlabs.com/api/aws/cfn-callback"

Resources:
  AxiomAgentReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      # Role name derives from the session-unique ExternalId so reruns
      # never collide with a stale role left over from a prior failed
      # attempt. ExternalId is "axiom-<8-32 alphanumerics>" so the
      # resulting role name fits well under IAM's 64-char limit.
      RoleName: !Sub "AxiomAgentReadOnly-${ExternalId}"
      Description: >
        Cross-account read-only role assumed by Axiom Agent
        (VisionXIXLabs). 1-hour session, ExternalId-gated, read-only
        permissions across the AWS surfaces the scanner needs.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${BrokerAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: AxiomAgentReadOnlyInline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AxiomAgentReadOnly
                Effect: Allow
                Action:
                  # Compute + networking inventory
                  - "ec2:Describe*"
                  - "elasticloadbalancing:Describe*"
                  - "autoscaling:Describe*"
                  # Storage / databases
                  - "rds:Describe*"
                  - "rds:ListTagsForResource"
                  - "s3:ListAllMyBuckets"
                  - "s3:GetBucketLocation"
                  - "s3:GetBucketPolicy"
                  - "s3:GetBucketAcl"
                  - "s3:GetEncryptionConfiguration"
                  - "s3:GetBucketVersioning"
                  # Metrics
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:ListMetrics"
                  - "cloudwatch:GetMetricStatistics"
                  # IAM posture
                  - "iam:GetAccountSummary"
                  - "iam:ListRoles"
                  - "iam:ListUsers"
                  - "iam:GetRole"
                  - "iam:ListAccessKeys"
                  - "iam:GetAccessKeyLastUsed"
                  # Cost
                  - "ce:GetCostAndUsage"
                  - "ce:GetCostForecast"
                  # Tagging
                  - "tag:GetResources"
                  # Identity probe
                  - "sts:GetCallerIdentity"
                Resource: "*"
      Tags:
        - Key: ManagedBy
          Value: VisionXIXLabs
        - Key: Purpose
          Value: AxiomAgent-CrossAccount-ReadOnly

  # ─── Auto-notify the platform when CREATE_COMPLETE fires ──────────────
  # The Lambda below runs inside the customer's account once at stack
  # creation, POSTs the new role's ARN + account id + external id to
  # the platform's webhook, then returns success to CloudFormation. The
  # onboarding page polls our DB for the callback and auto-advances —
  # no click on FinishUrl required.

  AxiomNotifyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "AxiomNotifyLambda-${ExternalId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

  AxiomNotifyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "AxiomNotify-${ExternalId}"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt AxiomNotifyLambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import urllib.request
          import urllib.error
          import logging

          log = logging.getLogger()
          log.setLevel(logging.INFO)

          def send_cfn_response(event, context, status, data=None, reason=None):
              body = {
                  "Status": status,
                  "Reason": reason or f"See CloudWatch log stream {context.log_stream_name}",
                  "PhysicalResourceId": event.get("PhysicalResourceId") or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {},
              }
              encoded = json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"],
                  data=encoded,
                  method="PUT",
                  headers={"Content-Type": "", "Content-Length": str(len(encoded))},
              )
              try:
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  log.warning(f"cfn response post failed: {e}")

          def handler(event, context):
              log.info(f"event: {json.dumps({k: v for k, v in event.items() if k != 'ResponseURL'})}")
              # Only POST on Create. Update + Delete just return success.
              if event["RequestType"] != "Create":
                  send_cfn_response(event, context, "SUCCESS")
                  return

              props = event.get("ResourceProperties", {})
              callback_url = props.get("CallbackUrl")
              payload = {
                  "stackId": event["StackId"],
                  "roleArn": props.get("RoleArn"),
                  "accountId": props.get("AccountId"),
                  "externalId": props.get("ExternalId"),
                  "region": props.get("Region"),
              }
              try:
                  body = json.dumps(payload).encode("utf-8")
                  req = urllib.request.Request(
                      callback_url,
                      data=body,
                      method="POST",
                      headers={"Content-Type": "application/json"},
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      log.info(f"webhook responded {resp.status}")
              except Exception as e:
                  log.warning(f"webhook post failed: {e}")

              send_cfn_response(event, context, "SUCCESS", data={"Notified": "true"})

  AxiomNotifyResource:
    Type: Custom::AxiomNotify
    DependsOn: AxiomAgentReadOnlyRole
    Properties:
      ServiceToken: !GetAtt AxiomNotifyLambda.Arn
      RoleArn: !GetAtt AxiomAgentReadOnlyRole.Arn
      AccountId: !Ref AWS::AccountId
      ExternalId: !Ref ExternalId
      Region: !Ref AWS::Region
      CallbackUrl: !Ref CallbackUrl

Outputs:
  RoleArn:
    Description: ARN of the read-only role Axiom assumes when it scans.
    Value: !GetAtt AxiomAgentReadOnlyRole.Arn

  RoleName:
    Description: Name of the created IAM role.
    Value: !Ref AxiomAgentReadOnlyRole

  AccountId:
    Description: Your AWS account id.
    Value: !Ref AWS::AccountId

  FinishUrl:
    Description: >
      Click this link to finish the connection — opens visionxixlabs.com
      with the Role ARN already filled in, validates the connection,
      and advances to the scan step. No copy-paste required.
    Value: !Sub "https://visionxixlabs.com/operator/onboarding?step=scan&roleArn=${AxiomAgentReadOnlyRole.Arn}&accountId=${AWS::AccountId}&externalId=${ExternalId}"
