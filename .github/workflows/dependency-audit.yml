name: Dependency audit

# Supply-chain integrity (A7.15). Reports known high/critical vulnerabilities in
# production dependencies. Weekly and when lockfiles change. Read-only: never
# installs scripts, deploys, or uses secrets.
on:
  schedule:
    - cron: "0 7 * * 1"
  pull_request:
    paths: ["package-lock.json", "desktop/package-lock.json", "desktop/src-tauri/Cargo.lock", ".github/workflows/dependency-audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Web app
        run: npm audit --omit=dev --audit-level=high
      - name: Desktop app
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high
