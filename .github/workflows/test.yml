name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Vitest suite
        run: npx vitest run --reporter=dot

      - name: Run offline auth recovery evidence tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_auth_recovery_evidence.py' -v

      - name: Build production website (no deployment)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
