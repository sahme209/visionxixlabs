name: Expected schema export (one-off)
# One-off, user-approved 2026-11-08: compare the migration chain with prisma/schema.prisma on a
# disposable Postgres inside this job. No secrets, no production, no deployment. Throwaway branch only.
on:
  push:
    branches: ["ci-check/schema-drift"]
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FRESH: postgresql://postgres:postgres@localhost:5432/fresh
      SHADOW: postgresql://postgres:postgres@localhost:5432/shadow
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create disposable databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE fresh' -c 'CREATE DATABASE shadow'
      - name: Build the expected schema directly from schema.prisma
        run: DATABASE_URL="$FRESH" npx prisma db push --skip-generate --accept-data-loss 2>&1 | tail -5
      - name: Export the expected structure (same shape as the production read-only query)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d fresh -At -c "
          SELECT json_build_object(
            'columns', (SELECT json_object_agg(table_name, cols) FROM (
                SELECT table_name, json_object_agg(column_name, udt_name || CASE WHEN is_nullable='NO' THEN ' NOT NULL' ELSE '' END || coalesce(' DEFAULT ' || column_default, '')) AS cols
                FROM information_schema.columns WHERE table_schema='public' GROUP BY table_name) t),
            'indexes', (SELECT json_agg(indexname ORDER BY indexname) FROM pg_indexes WHERE schemaname='public'),
            'enums', (SELECT json_object_agg(t.typname, (SELECT json_agg(e.enumlabel ORDER BY e.enumsortorder) FROM pg_enum e WHERE e.enumtypid=t.oid))
                      FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname='public' AND t.typtype='e'))" > expected.json
          wc -c expected.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema-drift
          path: |
            expected.json
          retention-days: 3
