name: Axiom AWS ECS Deploy

on:
  workflow_dispatch:
    inputs:
      role_arn:
        required: true
        type: string
      region:
        required: true
        type: string
      cluster:
        required: true
        type: string
      service:
        required: true
        type: string

# Platform source only: the customer repository template is a separate artifact.
# Axiom's own release requires exact reviewed action/run delegation and a
# separately qualified private issuer. Do not restore direct GitHub OIDC→AWS
# exchange or waiter-triggered automatic rollback here.
permissions: {}

concurrency:
  group: axiom-platform-ecs-retired-entrypoint
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require managed platform deployment
        run: |
          echo "::error::Axiom managed deployment review is required. This unmanaged entrypoint is retired."
          echo "No credential or provider action was performed. Use the exact reviewed platform action and qualified private runner; those controls are not enabled by this workflow."
          exit 1
