name: Desktop Microsoft Store package

# Builds the V19 desktop app as an MSIX package for the Microsoft Store. The Store signs the package
# after certification, so this workflow uploads it unsigned: no certificate or secret is involved.
# Identity values come from Partner Center (Product identity) through the repository variables
# MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME and MSIX_DISPLAY_NAME (the reserved app
# name); until they exist a placeholder
# identity is used and the summary says the package is for testing only.
# Before uploading, the job installs the package with a throwaway test certificate, checks that the
# app starts and the sign-in link is registered, and removes it again.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to package, for example desktop-v0.1.27'
        required: true
        type: string

concurrency:
  group: desktop-msix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  msix:
    name: Build and install-test MSIX
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build the Store app (no installer)
        working-directory: desktop
        env:
          # The Store installs updates, so the app does not point people at the download page.
          VITE_V19_DISTRIBUTION: microsoft_store
        run: npx tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Stage and pack MSIX
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP 'msix-stage'
          New-Item -ItemType Directory -Force -Path "$stage/Assets" | Out-Null
          Copy-Item "desktop/src-tauri/target/$env:TARGET/release/axiom-desktop.exe" $stage
          Copy-Item desktop/msix/Assets/*.png "$stage/Assets/"
          $out = python scripts/msix/render_manifest.py desktop/msix/AppxManifest.template.xml "$stage/AppxManifest.xml" $version "$env:MSIX_IDENTITY_NAME" "$env:MSIX_PUBLISHER" "$env:MSIX_PUBLISHER_DISPLAY_NAME" "$env:MSIX_DISPLAY_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'manifest rendering failed' }
          $placeholder = [bool](@($out) -match 'placeholder_identity=true')
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory | Where-Object Name -Match '^10\.' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdk.FullName 'x64\makeappx.exe'
          $signtool = Join-Path $sdk.FullName 'x64\signtool.exe'
          $package = Join-Path $env:RUNNER_TEMP "V19_${version}_x64.msix"
          & $makeappx pack /d $stage /p $package /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx pack failed' }
          "package=$package" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "placeholder=$placeholder" >> $env:GITHUB_OUTPUT
          "signtool=$signtool" >> $env:GITHUB_OUTPUT

      - name: Install-test with a throwaway certificate
        shell: pwsh
        env:
          PACKAGE: ${{ steps.pack.outputs.package }}
          SIGNTOOL: ${{ steps.pack.outputs.signtool }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Sign a copy only for this test; the uploaded package stays unsigned for the Store to sign.
          $publisher = ([xml](Get-Content (Join-Path $env:RUNNER_TEMP 'msix-stage/AppxManifest.xml'))).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName 'V19 MSIX test only' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $test = Join-Path $env:RUNNER_TEMP 'test-signed.msix'
          Copy-Item $env:PACKAGE $test
          & $env:SIGNTOOL sign /fd SHA256 /sha1 $cert.Thumbprint /s My $test
          if ($LASTEXITCODE -ne 0) { throw 'test signing failed' }
          $cer = Join-Path $env:RUNNER_TEMP 'test.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          try {
            Add-AppxPackage -Path $test
            $pkg = Get-AppxPackage | Where-Object { $_.Name -eq ([xml](Get-Content (Join-Path $env:RUNNER_TEMP 'msix-stage/AppxManifest.xml'))).Package.Identity.Name }
            if (-not $pkg) { throw 'package not installed' }
            $exe = Join-Path $pkg.InstallLocation 'axiom-desktop.exe'
            if (-not (Test-Path $exe)) { throw 'app executable missing from the installed package' }
            $proto = Get-AppxPackageManifest $pkg | Select-Xml -Namespace @{ uap = 'http://schemas.microsoft.com/appx/manifest/uap/windows10' } -XPath '//uap:Protocol[@Name="axiom-agent"]'
            if (-not $proto) { throw 'sign-in link not registered' }
            Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!V19"
            Start-Sleep -Seconds 15
            $running = Get-Process -Name 'axiom-desktop' -ErrorAction SilentlyContinue
            if (-not $running) { throw 'app did not stay running after launch' }
            $running | Stop-Process -Force
            "Installed $($pkg.PackageFullName); started and stayed running; sign-in link registered." | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          } finally {
            Get-AppxPackage | Where-Object { $_.Publisher -eq $publisher } | Remove-AppxPackage -ErrorAction SilentlyContinue
            Get-ChildItem 'Cert:\LocalMachine\TrustedPeople' | Where-Object Thumbprint -eq $cert.Thumbprint | Remove-Item
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)"
          }

      - name: Summary
        shell: pwsh
        env:
          PLACEHOLDER: ${{ steps.pack.outputs.placeholder }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          if ($env:PLACEHOLDER -eq 'True') {
            "**Testing only.** Built with a placeholder identity. Set MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME from Partner Center, then run again to get a package you can upload." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "V19 $env:VERSION MSIX is ready to upload in Partner Center. It is unsigned on purpose: the Store signs it after certification." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: v19-msix-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.package }}
          retention-days: 14
          if-no-files-found: error
