name: Governance gate 1 — journal on a real Linux host

# Free, disposable GitHub-hosted runner. Runs the unmodified original-attempt journal primitive
# against real filesystems, processes and POSIX ACLs (no mocks). Governance stays disabled; no
# credentials, secrets, cloud resources or deployments are used.
on:
  pull_request:
    paths:
      - 'scripts/governance_original_attempt.py'
      - 'scripts/governance_linux_host_check.py'
      - '.github/workflows/governance-linux-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install POSIX ACL tools
        run: sudo apt-get install -y --no-install-recommends acl >/dev/null
      - name: Journal checks as an ordinary user
        run: python3 -I scripts/governance_linux_host_check.py --receipt user-receipt.json
      - name: Journal checks as root (root-owned journal, tmpfs)
        run: sudo -n python3 -I scripts/governance_linux_host_check.py --root --receipt root-receipt.json
      - name: Keep the receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-linux-host-${{ matrix.runner }}
          path: '*-receipt.json'
          if-no-files-found: warn
