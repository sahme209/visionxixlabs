name: Read-only production auth preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm

      - name: Install locked tooling without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate database client without database credentials
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Inspect using a read-only transaction and public-safe output
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_PREFLIGHT_FOUNDER_EMAIL: ${{ secrets.AUTH_PREFLIGHT_FOUNDER_EMAIL }}
        run: node scripts/auth-recovery-preflight.mjs --public-summary
