name: Desktop CI

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/api/desktop/**'
      - 'lib/desktop/**'
      - 'lib/axiom/agentRuntime/agentProfiles.ts'
      - 'components/Footer.tsx'
      - 'app/demo/page.tsx'
      - 'scripts/check-desktop-release.mjs'
      - 'scripts/desktop-release-versions.mjs'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/desktop-ci.yml'
  # Native validation runs at PR/main checkpoints, not twice per feature push.
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'app/api/desktop/**'
      - 'lib/desktop/**'
      - 'lib/axiom/agentRuntime/agentProfiles.ts'
      - 'components/Footer.tsx'
      - 'app/demo/page.tsx'
      - 'scripts/check-desktop-release.mjs'
      - 'scripts/desktop-release-versions.mjs'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/desktop-ci.yml'

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Frontend and native security checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Validate release identity and build frontend
        working-directory: desktop
        run: npm run build

      - name: Test native commands
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Lint native commands
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  macos-native:
    name: macOS native transport and policy checks
    runs-on: macos-latest
    timeout-minutes: 30
    # Compile/test the actual target platform without packaging installers,
    # loading signing credentials, publishing, or accessing any live provider.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Validate release identity and build frontend only
        working-directory: desktop
        run: npm run build

      - name: Test native macOS commands and synthetic transport fixtures
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Lint native macOS commands
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  windows-native:
    name: Windows frontend and native security checks
    runs-on: windows-2022
    timeout-minutes: 30
    # Standard public runner only. No installer, signing, publication, live
    # provider, credential-vault access or Governance artifact execution.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Validate release identity and build frontend only
        working-directory: desktop
        run: npm run build

      - name: Test native Windows commands and isolated security fixtures
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Lint native Windows commands
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  windows-installed-candidate:
    name: Windows installer and upgrade acceptance
    needs: windows-native
    if: ${{ github.event_name == 'pull_request' && github.repository_id == '1130181785' && github.repository == 'sahme209/visionxixlabs' && github.actor == 'sahme209' && github.event.pull_request.number == 339 && github.event.pull_request.head.ref == 'codex/watched-review-corrections' && github.event.pull_request.head.repo.id == 1130181785 && github.event.pull_request.base.ref == 'main' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 42
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Fixed credential-free installed candidate QA
        env:
          AXIOM_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: pwsh
        run: python scripts/windows_installed_acceptance.py
