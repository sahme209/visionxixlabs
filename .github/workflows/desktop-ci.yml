name: Desktop CI

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/api/desktop/**'
      - 'lib/desktop/**'
      - 'scripts/check-desktop-release.mjs'
      - '.github/workflows/desktop-ci.yml'
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'desktop/**'
      - 'app/api/desktop/**'
      - 'lib/desktop/**'
      - 'scripts/check-desktop-release.mjs'
      - '.github/workflows/desktop-ci.yml'

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Frontend and native security checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Validate release identity and build frontend
        working-directory: desktop
        run: npm run build

      - name: Test native commands
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Lint native commands
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
