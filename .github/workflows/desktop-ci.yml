name: Desktop CI

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/api/desktop/**'
      - 'lib/desktop/**'
      - 'lib/axiom/agentRuntime/agentProfiles.ts'
      - 'components/Footer.tsx'
      - 'app/demo/page.tsx'
      - 'scripts/check-desktop-release.mjs'
      - 'scripts/desktop-release-versions.mjs'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/desktop-ci.yml'
  # Native validation runs at PR/main checkpoints, not twice per feature push.
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'app/api/desktop/**'
      - 'lib/desktop/**'
      - 'lib/axiom/agentRuntime/agentProfiles.ts'
      - 'components/Footer.tsx'
      - 'app/demo/page.tsx'
      - 'scripts/check-desktop-release.mjs'
      - 'scripts/desktop-release-versions.mjs'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/desktop-ci.yml'

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Frontend and native security checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Validate release identity and build frontend
        working-directory: desktop
        run: npm run build

      - name: Test native commands
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Lint native commands
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  macos-native:
    name: macOS native transport and policy checks
    runs-on: macos-latest
    timeout-minutes: 30
    # Compile/test the actual target platform without packaging installers,
    # loading signing credentials, publishing, or accessing any live provider.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Validate release identity and build frontend only
        working-directory: desktop
        run: npm run build

      - name: Test native macOS commands and synthetic transport fixtures
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Lint native macOS commands
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
