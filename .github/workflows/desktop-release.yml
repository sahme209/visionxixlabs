name: Desktop release

# Builds Axiom Agent for macOS (Apple Silicon + Intel), Windows, and Linux
# on every tag matching `desktop-v*`. Binaries are produced in this private
# repo by the build matrix, then a single `publish` job uploads them to the
# public `sahme209/axiom-releases` repo so end users can download without
# needing access to the private code.
#
# Required secrets:
#   GITHUB_TOKEN              — provided automatically. Used by tauri-action
#                               for build-time API calls within this repo.
#   RELEASES_REPO_TOKEN       — PAT with `repo` scope on sahme209/axiom-releases.
#                               Used to create releases + upload assets in the
#                               public repo.
#   APPLE_CERTIFICATE         — base64 .p12 Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY    — e.g. "Developer ID Application: ... (TEAMID)"
#   APPLE_ID                  — Apple ID email for notarization
#   APPLE_PASSWORD            — App-Specific password for notarization
#   APPLE_TEAM_ID

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci || npm install

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      # tauri-action builds + signs but does NOT publish here. We capture the
      # artefacts and let the publish job upload them to the public repo.
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE:           ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:      ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:              ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: axiom-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: warn

  publish:
    name: Publish to public releases repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every build's artefacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten artefacts
        run: |
          mkdir -p flat
          find ./artifacts -type f \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \
               -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} flat/ \;
          echo "--- Flat directory:"
          ls -la flat/

      - name: Install GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Import GPG key + create detached signatures
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID:      ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

          # Create a detached signature for every artefact. Universal —
          # works for .deb, .rpm, .AppImage, .dmg, .msi, .exe alike.
          # Users verify with:
          #   gpg --import axiom-public-key.asc
          #   gpg --verify <file>.asc <file>
          for f in flat/*; do
            [ -e "$f" ] || continue
            echo "Signing $f"
            gpg --batch --yes --local-user "$GPG_KEY_ID" \
                --output "${f}.asc" --armor --detach-sign "$f"
          done

          echo "--- After signing:"
          ls -la flat/

      - name: Create release in public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          cat > release-notes.md <<'NOTES'
          # Axiom Agent ${{ github.ref_name }}

          Cross-platform desktop builds. Signing status per platform:

          - **macOS (Apple Silicon + Intel):** signed + notarized when Apple Developer secrets are configured on the build (right-click → Open only if your Apple cert hasn't propagated yet).
          - **Windows (x64 .msi / .exe):** unsigned — click "More info" → "Run anyway" on the SmartScreen prompt. Signed builds activate when a Windows EV cert is configured.
          - **Every artefact** ships with a detached GPG signature (`.asc` file alongside each download). Verify origin with:
              ```
              curl -sLO https://github.com/sahme209/axiom-releases/raw/main/axiom-public-key.asc
              gpg --import axiom-public-key.asc
              gpg --verify <file>.asc <file>
              ```
          - **Windows (x64 .msi / .exe):** unsigned executable + GPG-signed for origin verification. SmartScreen still shows "More info → Run anyway" prompt.

          Every build carries the same HMAC-signed handoff contract and refuses local apply by default.
          NOTES

          # Create (or update) the release in the public repo and upload all bundles.
          gh release create "${{ github.ref_name }}" \
            --repo sahme209/axiom-releases \
            --title "Axiom Agent ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            flat/* || gh release upload "${{ github.ref_name }}" flat/* --repo sahme209/axiom-releases --clobber
