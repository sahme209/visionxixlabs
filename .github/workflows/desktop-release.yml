name: Desktop release

# Builds Axiom Agent for macOS (Apple Silicon + Intel), Windows, and Linux
# on every tag matching `desktop-v*`. Uploads each artefact to a GitHub
# Release. Signs + notarizes when the relevant secrets are present;
# otherwise ships honest unsigned binaries that still run end-to-end.
#
# Required secrets when ready (each one is optional; missing secrets just
# skip that signing step):
#   APPLE_CERTIFICATE             — base64-encoded .p12 Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD    — password for the .p12
#   APPLE_SIGNING_IDENTITY        — e.g. "Developer ID Application: Vision XIX Labs LLC (TEAMID)"
#   APPLE_ID                      — Apple ID email for notarization
#   APPLE_PASSWORD                — App-Specific password for notarization
#   APPLE_TEAM_ID                 — 10-char Apple team id
#   WINDOWS_CERTIFICATE           — base64-encoded .pfx EV cert
#   WINDOWS_CERTIFICATE_PASSWORD  — password for the .pfx
#   TAURI_PRIVATE_KEY             — Tauri updater signing key
#   TAURI_KEY_PASSWORD            — password for TAURI_PRIVATE_KEY

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 0.1.0)'
        required: false

permissions:
  contents: write   # needed to create + upload release assets

jobs:
  build:
    name: Build (${{ matrix.platform }} · ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci || npm install

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # Apple signing — optional. Tauri detects these and signs automatically.
          APPLE_CERTIFICATE:           ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:      ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:              ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing — optional.
          TAURI_PRIVATE_KEY:           ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD:          ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Axiom Agent ${{ github.ref_name }}'
          releaseBody: |
            Multi-platform desktop build.

            Signing status is honest per platform:
            - **macOS:** signed + notarized when Apple Developer secrets are present; otherwise unsigned (right-click → Open the first time).
            - **Windows:** signed when EV cert is present; otherwise unsigned (SmartScreen → More info → Run anyway).
            - **Linux:** unsigned binary + AppImage (chmod +x to run).

            All builds carry the same HMAC handoff signer and refuse local apply by default.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          args: --target ${{ matrix.target }}

      # Windows signing — invoked separately because Tauri doesn't natively
      # handle PFX-based signing in the action yet.
      - name: Sign Windows binaries
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE:          ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes('cert.pfx', $bytes)
          $msi = Get-ChildItem -Recurse "desktop\src-tauri\target\${{ matrix.target }}\release\bundle\msi" -Include *.msi | Select-Object -First 1
          if ($msi) {
            & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $msi.FullName
            echo "Signed $($msi.FullName)"
          } else {
            echo "::warning::No MSI artefact found to sign."
          }
          Remove-Item cert.pfx -Force

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: axiom-agent-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: warn
