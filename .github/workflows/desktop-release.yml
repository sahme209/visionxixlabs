name: Desktop release

# Builds Axiom Agent for macOS (Apple Silicon + Intel), Windows, and Linux
# on every tag matching `desktop-v*`. Binaries are produced in this private
# repo by the build matrix, then a single `publish` job uploads them to the
# public `sahme209/axiom-releases` repo so end users can download without
# needing access to the private code.
#
# Required secrets:
#   GITHUB_TOKEN              — provided automatically. Used by tauri-action
#                               for build-time API calls within this repo.
#   RELEASES_REPO_TOKEN       — PAT with `repo` scope on sahme209/axiom-releases.
#                               Used to create releases + upload assets in the
#                               public repo.
#   APPLE_CERTIFICATE         — base64 .p12 Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY    — e.g. "Developer ID Application: ... (TEAMID)"
#   APPLE_ID                  — Apple ID email for notarization
#   APPLE_PASSWORD            — App-Specific password for notarization
#   APPLE_TEAM_ID
#   GPG_PRIVATE_KEY          — armored private key used for detached asset signatures
#   GPG_KEY_ID               — signing key id corresponding to the published public key

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact release tag, for example desktop-v0.1.9'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Match tag to the desktop package version
        id: identity
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          expected_tag="desktop-v$(node -p "require('./desktop/package.json').version")"
          if [ "$REQUESTED_TAG" != "$expected_tag" ]; then
            echo "Release tag $REQUESTED_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
          echo "release_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci || npm install

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      # tauri-action builds + signs but does NOT publish here. We capture the
      # artefacts and let the publish job upload them to the public repo.
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE:           ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:      ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:              ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}

      - name: Verify Apple signature, Gatekeeper acceptance, and notarization ticket
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          app_path=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          dmg_path=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$app_path" && test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --verbose=4 "$dmg_path"
          hdiutil verify "$dmg_path"

      - name: Record platform release attestation
        shell: bash
        run: |
          signed=false
          notarized=false
          if [[ "${{ matrix.label }}" == macos-* ]]; then
            signed=true
            notarized=true
          fi
          {
            echo "platform=${{ matrix.label }}"
            echo "artifact_signed=$signed"
            echo "artifact_notarized=$notarized"
          } > "desktop/release-attestation-${{ matrix.label }}.env"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: axiom-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            desktop/release-attestation-${{ matrix.label }}.env
          if-no-files-found: error

  publish:
    name: Publish to public releases repo
    needs: [validate-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download every build's artefacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten artefacts
        run: |
          mkdir -p flat
          find ./artifacts -type f \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \
               -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} flat/ \;
          echo "--- Flat directory:"
          ls -la flat/

      - name: Install GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Import GPG key + create detached signatures
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID:      ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

          # Create a detached signature for every artefact. Universal —
          # works for .deb, .rpm, .AppImage, .dmg, .msi, .exe alike.
          # Users verify with:
          #   gpg --import axiom-public-key.asc
          #   gpg --verify <file>.asc <file>
          for f in flat/*; do
            [ -e "$f" ] || continue
            echo "Signing $f"
            gpg --batch --yes --local-user "$GPG_KEY_ID" \
                --output "${f}.asc" --armor --detach-sign "$f"
          done

          echo "--- After signing:"
          ls -la flat/

      - name: Verify asset version matches release tag
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          # Extract version from tag (desktop-v0.1.12 -> 0.1.12)
          expected_version="${RELEASE_TAG#desktop-v}"

          echo "Checking that all assets contain version: $expected_version"

          # Verify every installer contains the correct version in its filename
          failed=false
          for f in flat/*; do
            # Skip signature files
            if [[ "$f" == *.asc ]]; then
              continue
            fi
            # Extract just the filename
            basename_f=$(basename "$f")
            if ! [[ "$basename_f" =~ ${expected_version} ]]; then
              echo "ERROR: Asset $basename_f does not contain expected version $expected_version"
              failed=true
            else
              echo "✓ $basename_f contains version $expected_version"
            fi
          done

          if [ "$failed" = true ]; then
            echo "Version mismatch detected. The build produced binaries for a different version than intended."
            echo "This prevents publishing incorrect binaries under the wrong release tag."
            exit 1
          fi

          echo "All assets verified to contain the correct version."

      - name: Create release in public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          require_attestation() {
            label="$1"
            expected_signed="$2"
            expected_notarized="$3"
            file=$(find artifacts -name "release-attestation-${label}.env" -print -quit)
            test -n "$file"
            grep -qx "artifact_signed=${expected_signed}" "$file"
            grep -qx "artifact_notarized=${expected_notarized}" "$file"
          }

          require_attestation macos-arm true true
          require_attestation macos-intel true true
          require_attestation windows-x64 false false
          require_attestation linux-x64 false false

          cat > release-notes.md <<'NOTES'
          # Axiom Agent ${{ needs.validate-release.outputs.release_tag }}

          Cross-platform desktop builds. Signing status per platform:

          - **macOS (Apple Silicon + Intel):** Apple Developer ID signed, accepted by Gatekeeper, and notarization ticket validated in this release build.
          - **Windows (x64 .msi / .exe):** unsigned — click "More info" → "Run anyway" on the SmartScreen prompt. Signed builds activate when a Windows EV cert is configured.
          - **Every artefact** ships with a detached GPG signature (`.asc` file alongside each download). Verify origin with:
              ```
              curl -sLO https://github.com/sahme209/axiom-releases/raw/main/axiom-public-key.asc
              gpg --import axiom-public-key.asc
              gpg --verify <file>.asc <file>
              ```
          Every build carries the same HMAC-signed handoff contract and refuses local apply by default.

          <!-- Machine-readable release attestations. These are emitted only after the checks above pass. -->
          source-commit: ${{ github.sha }}
          macos-artifact-signed: true
          macos-artifact-notarized: true
          windows-artifact-signed: false
          linux-artifact-signed: false
          NOTES

          # Create or deterministically update the release. Never mask a failed
          # create with an asset upload that leaves stale release notes behind.
          if gh release view "${{ needs.validate-release.outputs.release_tag }}" --repo sahme209/axiom-releases >/dev/null 2>&1; then
            gh release edit "${{ needs.validate-release.outputs.release_tag }}" \
              --repo sahme209/axiom-releases \
              --title "Axiom Agent ${{ needs.validate-release.outputs.release_tag }}" \
              --notes-file release-notes.md
            gh release upload "${{ needs.validate-release.outputs.release_tag }}" flat/* \
              --repo sahme209/axiom-releases --clobber
          else
            gh release create "${{ needs.validate-release.outputs.release_tag }}" \
              --repo sahme209/axiom-releases \
              --title "Axiom Agent ${{ needs.validate-release.outputs.release_tag }}" \
              --notes-file release-notes.md \
              flat/*
          fi
