name: Dependency fix PR

# Runs `npm audit fix` (no --force: no breaking upgrades) on GitHub's runners,
# because local installs are blocked, and opens a PR. The PR must pass the full
# Test check before anyone merges it. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Optional exact upgrades, e.g. '@azure/msal-node@7.2.1' (space-separated). Empty = non-breaking audit fix only."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply requested exact upgrades
        if: ${{ inputs.packages != '' }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          # Only package specs of the form name@version are accepted.
          for p in $PACKAGES; do echo "$p" | grep -Eq '^(@[a-z0-9._-]+/)?[a-z0-9._-]+@[0-9][0-9A-Za-z.+-]*$' || { echo "refused: $p"; exit 1; }; done
          npm install --ignore-scripts --save-exact $PACKAGES
      - name: Apply non-breaking fixes
        run: |
          npm audit fix --omit=dev --ignore-scripts || true
          (cd desktop && npm audit fix --omit=dev --ignore-scripts || true)
      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          branch="deps/audit-fix-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "deps: ${{ inputs.packages != '' && format('upgrade {0}', inputs.packages) || 'npm audit fix (non-breaking)' }}"
          git push origin "$branch"
          after=$(npm audit --omit=dev --audit-level=high >/dev/null 2>&1 && echo "none" || echo "some remain (likely need breaking upgrades)")
          echo "Branch pushed: $branch (high-severity after fix: ${after}). Open a PR from it; Actions cannot create PRs in this repo."
