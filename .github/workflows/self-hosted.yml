name: Self-hosted image

# Builds the self-hosted kit (deploy/self-hosted) from scratch, starts PostgreSQL, runs migrations and the
# app, and checks that the app serves its status and home pages. Throwaway secrets, generated per run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/self-hosted/**"
      - ".dockerignore"
      - ".github/workflows/self-hosted.yml"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: deploy/self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write a throwaway configuration
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "NEXTAUTH_URL=http://localhost:3000"
            echo "NEXTAUTH_SECRET=$(openssl rand -base64 48)"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Build
        run: docker compose build

      - name: Start PostgreSQL, migrate and start the app
        run: docker compose up -d

      - name: Wait for the app
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/status || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::The app did not answer /api/status (last status $code)"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          curl -fsS http://127.0.0.1:3000/api/status | head -c 600; echo

      - name: Migrations ran
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop and remove
        if: always()
        run: docker compose down -v
