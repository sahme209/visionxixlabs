# Supply-chain integrity (A7.15). One grouped PR per ecosystem per week (not one
# PR per package), so updates arrive as reviewable batches. Each batch must pass
# the full Test check. Major updates are grouped separately for careful review.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      web-minor-patch: { update-types: ["minor", "patch"] }
      web-major: { update-types: ["major"] }
    # Next.js is pinned by reviewed-source checks. Upgrade it in a planned PR
    # that re-reviews those pins, not in the weekly batch. AWS updates must
    # still pass the installed ECS snapshot and S3 transport contracts.
    # Platform migrations get their own planned PR (see docs/product/remaining-work.md),
    # so they do not block the weekly major batch.
    ignore:
      # Next.js: each bump re-checks the pinned framework/closure files (16.4.2 -> 16.4.5 unchanged) and re-pins.
      - { dependency-name: "next" }
      - { dependency-name: "eslint-config-next" }
      # Vitest minors/patches: the test-child fixture pins the version and preload hash, so
      # each bump re-checks suppress-warnings.cjs (unchanged 4.1.11 -> 4.1.12) and updates the pin.
      - { dependency-name: "vitest" }
      # Stripe 23 also changes HttpClient types;
      # Stripe: any release can move the pinned API version (billing behaviour).
      - { dependency-name: "stripe" }
      - { dependency-name: "typescript", update-types: ["version-update:semver-major"] }
      - { dependency-name: "prisma", update-types: ["version-update:semver-major"] }
      - { dependency-name: "@prisma/client", update-types: ["version-update:semver-major"] }
      - { dependency-name: "eslint", update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: "/desktop"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      desktop-minor-patch: { update-types: ["minor", "patch"] }
      desktop-major: { update-types: ["major"] }
    ignore:
      - { dependency-name: "typescript", update-types: ["version-update:semver-major"] }
  - package-ecosystem: cargo
    directory: "/desktop/src-tauri"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch: { update-types: ["minor", "patch"] }
      cargo-major: { update-types: ["major"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions-all: { patterns: ["*"] }
